name: duryssoile

x-db-env: &db-env
  POSTGRES_HOST: db
  POSTGRES_PORT: 5432
  POSTGRES_DB: ${POSTGRES_DB:-duryssoile}
  POSTGRES_USER: ${POSTGRES_USER:-duryssoile}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}

x-rustfs-env: &rustfs-env
  RUSTFS_ENDPOINT: http://rustfs:9000
  RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?set RUSTFS_ACCESS_KEY in .env}
  RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?set RUSTFS_SECRET_KEY in .env}
  RUSTFS_BUCKET: ${RUSTFS_BUCKET:-audio}

x-app-env: &app-env
  <<: [*db-env, *rustfs-env]
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
  SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}

# Every image is pinned by tag and digest, so a fresh pull gives exactly the
# images the stack was tested with even if a tag is later re-pushed. To
# upgrade one, pick a release tag on Docker Hub, read its notes, and update
# both parts.
services:
  db:
    # A new major version cannot read this data directory: upgrading past 16
    # takes a dump and restore, not just a new tag.
    image: postgres:16.15-alpine3.24@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-duryssoile}
      POSTGRES_USER: ${POSTGRES_USER:-duryssoile}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-duryssoile} -d ${POSTGRES_DB:-duryssoile}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible object storage for the pronunciation clips. Replaces the
  # read-only host bind mount the 2023 version used.
  rustfs:
    # The bucket lives in this version's on-disk format; check the release
    # notes for format changes before upgrading.
    image: rustfs/rustfs:1.0.0@sha256:8cc9801755448b71a786705ce76692c77e14936cccd87cf2fc31842e58f4d1ff
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?set RUSTFS_ACCESS_KEY in .env}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?set RUSTFS_SECRET_KEY in .env}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_VOLUMES: /data
      RUSTFS_OBS_LOGGER_LEVEL: error
    command: ["/data"]
    volumes:
      - rustfs_data:/data
    ports:
      # Console only, for eyeballing the bucket. The S3 API (9000) stays
      # internal to the compose network.
      - "${RUSTFS_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      # RustFS answers 403 on / for unauthenticated callers, so probe its
      # dedicated /health endpoint instead -- curl -f would reject the 403.
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/health -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  backend:
    build: .
    image: duryssoile-backend
    restart: unless-stopped
    environment:
      <<: *app-env
      # With TLS on, the admin session cookie is marked Secure.
      SESSION_HTTPS_ONLY: ${TLS:-off}
    depends_on:
      db:
        condition: service_healthy
      rustfs:
        condition: service_healthy
      # The backend does not start until setup has migrated the database and,
      # on a fresh deployment, imported the seed data -- so it never serves an
      # outdated schema or an empty dataset. A failed setup blocks startup.
      setup:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  # Reverse proxy; see caddy/Caddyfile. With TLS=on it serves DOMAIN over
  # HTTPS and obtains and renews the certificate itself.
  caddy:
    image: caddy:2.11.4-alpine@sha256:6aeddd44c3078b0f9a35206472a11420648a79c184603ef95957d0a20044cb2b
    restart: unless-stopped
    environment:
      TLS: ${TLS:-off}
      DOMAIN: ${DOMAIN:-}
    volumes:
      - ./caddy/:/etc/caddy/:ro
      # The certificates and the ACME account. Keep this volume: recreating
      # it means requesting new certificates, which Let's Encrypt rate-limits.
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "${HTTP_PORT:-8080}:80"
      - "${HTTPS_PORT:-8443}:443"
    depends_on:
      backend:
        condition: service_started

  # Runs on every `up` before the backend starts: applies the migrations,
  # then imports ./seed if the database has no words yet. Same image as the
  # backend. On an existing deployment it finishes in a second or two.
  #   docker compose run --rm setup --reset   # wipe and reimport the seed
  setup:
    build: .
    image: duryssoile-backend
    entrypoint: ["python", "-m", "app.bootstrap"]
    command: []
    restart: "no"
    environment:
      <<: *app-env
      UPLOAD_CONCURRENCY: ${UPLOAD_CONCURRENCY:-16}
    volumes:
      - ./seed/:/srv/seed/:ro
      # The clips, laid out as <type>/<filename>. They default to
      # ./seed/audio; AUDIO_DIR points elsewhere on the host instead.
      - ${AUDIO_DIR:-./seed/audio}/:/srv/seed/audio/:ro
    depends_on:
      db:
        condition: service_healthy
      rustfs:
        condition: service_healthy

volumes:
  db_data:
  rustfs_data:
  caddy_data:
  caddy_config:
