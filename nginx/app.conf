upstream backend {
    server backend:8000;
}

server {
    listen 80;
    server_name _;

    # Audio responses are proxied straight from RustFS through the backend.
    client_max_body_size 12m;

    # /api/v1.0/... and /admin/... are both served by the backend; unlike the
    # 2023 setup there is no path rewrite, the app owns the full URL space.
    location / {
        proxy_pass http://backend;

        # $http_host keeps the client's port (e.g. :8080); $host drops it
        # and the app then builds redirects pointing at the wrong port.
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;
    }
}
